[package]
name = "mc-rs"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = ["crates-io"]
description = "A modern dual-panel terminal file manager"
repository = "https://github.com/uxsoft/mc-rs"

# cargo-binstall (and mise, which shells out to it) resolves the version from
# crates.io, then downloads the matching GitHub release asset instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "mc"

[[bin]]
name = "mc"
path = "src/main.rs"

# Image decoding and resampling otherwise take seconds per photograph in cargo run.
# Keep our application debuggable while optimizing the pixel-processing loops.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[dependencies]
anyhow = "1"
base64 = "0.22"
filetime = "0.2"
ratatui = "0.30.2"
crossterm = "0.29"
trash = "5"
tempfile = "3"
compress-tools = "0.16"
flate2 = "1"
shell-words = "1"
chrono = "0.4"
ctrlc = "3"
zeroize = "1"
ssh2 = "0.9.6"
suppaftp = { version = "8", default-features = false }
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
rars = "0.9"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pulldown-cmark = "0.13"
memmap2 = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"
hayro = "0.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
ratatui-image = { version = "10.0.8", default-features = false, features = ["crossterm"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "event"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tar = "0.4"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["compress", "aes256"] }
