name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Linux archive dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev pkg-config
      - name: macOS archive dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libarchive pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Windows archive dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libarchive:x64-windows-static-md
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Linux terminal smoke test
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          python3 tests/terminal_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: mc-${{ matrix.target }}
          path: |
            mc/target/${{ matrix.target }}/release/mc
            mc/target/${{ matrix.target }}/release/mc.exe
            LICENSE
            README.md
          if-no-files-found: error
