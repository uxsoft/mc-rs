[package]
name = "mc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A modern dual-panel terminal file manager"

[dependencies]
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
trash = "5"
tempfile = "3"
walkdir = "2"
compress-tools = "0.16"
flate2 = "1"
shell-words = "1"
chrono = "0.4"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
